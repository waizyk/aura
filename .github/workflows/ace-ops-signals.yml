name: ACE OPS signals

on:
  schedule:
    # Every 15 min, just after each M15 candle closes (times are UTC). Sun-Fri only (gold is closed on Saturday).
    - cron: "2,17,32,47 * * * 0-5"
  workflow_dispatch:
    inputs:
      test_notification:
        description: "Send a test notification to my phone"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: ace-ops-signals
  cancel-in-progress: false

jobs:
  signals:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Run ACE OPS engine
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          ACE_TEST_NOTIFY: ${{ github.event_name == 'workflow_dispatch' && inputs.test_notification && '1' || '0' }}
        run: python3 engine/ace_ops_engine.py

      - name: Save results for the dashboard
        run: |
          git config user.name "ACE OPS bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No changes to save"
          else
            git commit -m "ACE OPS update $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase --autostash
            git push
          fi
